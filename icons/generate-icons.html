<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MediFlow Icon Generator</title>
<style>
  body { font-family: sans-serif; background: #f0f4f4; padding: 20px; }
  h1 { color: #055C61; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 20px; }
  .item { background: white; border-radius: 12px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  canvas { border-radius: 8px; display: block; margin: 0 auto 8px; }
  button { background: #0A858C; color: white; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 13px; }
  button:hover { background: #055C61; }
  #download-all { background: #2e7d32; color: white; border: none; border-radius: 12px; padding: 14px 28px; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 20px; }
</style>
</head>
<body>
<h1>🏥 MediFlow PWA Icon Generator</h1>
<p>Click "Download All Icons" then place the PNG files in your <code>icons/</code> folder.</p>
<button id="download-all" onclick="downloadAll()">⬇️ Download All Icons</button>
<div class="grid" id="grid"></div>

<script>
const sizes = [72, 96, 128, 144, 152, 192, 384, 512];

function drawIcon(canvas, size, maskable) {
  const ctx = canvas.getContext('2d');
  const s = size;
  canvas.width = s;
  canvas.height = s;

  // Background
  const grad = ctx.createLinearGradient(0, 0, s, s);
  grad.addColorStop(0, '#055C61');
  grad.addColorStop(1, '#0A858C');

  // Rounded rect background
  const r = s * 0.2;
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(s - r, 0);
  ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s - r);
  ctx.quadraticCurveTo(s, s, s - r, s);
  ctx.lineTo(r, s);
  ctx.quadraticCurveTo(0, s, 0, s - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // White circle
  ctx.beginPath();
  ctx.arc(s / 2, s * 0.42, s * 0.28, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fill();

  // Draw "Rx" text
  ctx.fillStyle = '#FFFFFF';
  ctx.font = `bold ${s * 0.32}px Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Rx', s / 2, s * 0.42);

  // Green leaf dot accent
  ctx.beginPath();
  ctx.arc(s * 0.65, s * 0.28, s * 0.07, 0, Math.PI * 2);
  ctx.fillStyle = '#4CAF50';
  ctx.fill();

  // Bottom label
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = `600 ${s * 0.1}px Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('MediFlow', s / 2, s * 0.76);

  // Thin underline
  ctx.beginPath();
  ctx.moveTo(s * 0.25, s * 0.83);
  ctx.lineTo(s * 0.75, s * 0.83);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = s * 0.015;
  ctx.stroke();
}

function downloadCanvas(canvas, filename) {
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function downloadAll() {
  sizes.forEach((size, i) => {
    setTimeout(() => {
      const canvas = document.createElement('canvas');
      drawIcon(canvas, size, false);
      downloadCanvas(canvas, `icon-${size}.png`);
    }, i * 200);
  });
  // Also download maskable
  setTimeout(() => {
    const canvas = document.createElement('canvas');
    drawIcon(canvas, 512, true);
    downloadCanvas(canvas, 'icon-512-maskable.png');
  }, sizes.length * 200 + 200);
}

// Render previews
const grid = document.getElementById('grid');
[...sizes, 'maskable'].forEach(size => {
  const isMaskable = size === 'maskable';
  const s = isMaskable ? 512 : size;
  const preview = Math.min(s, 96);

  const div = document.createElement('div');
  div.className = 'item';

  const canvas = document.createElement('canvas');
  canvas.style.width = preview + 'px';
  canvas.style.height = preview + 'px';
  drawIcon(canvas, s, isMaskable);

  const label = document.createElement('div');
  label.style.fontSize = '12px';
  label.style.color = '#555';
  label.style.marginBottom = '8px';
  label.textContent = isMaskable ? '512×512 (maskable)' : `${s}×${s}`;

  const btn = document.createElement('button');
  btn.textContent = '⬇️ Download';
  btn.onclick = () => downloadCanvas(canvas, isMaskable ? 'icon-512-maskable.png' : `icon-${s}.png`);

  div.appendChild(canvas);
  div.appendChild(label);
  div.appendChild(btn);
  grid.appendChild(div);
});
</script>
</body>
</html>
